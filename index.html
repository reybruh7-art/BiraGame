<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Bira Super Adventure</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #5c94fc; touch-action: none; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  
  /* UI Header */
  #ui {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    color: white;
    font-weight: 900;
    font-size: 20px;
    text-shadow: 2px 2px #000;
    pointer-events: none;
    z-index: 10;
  }

  /* Kontrol Touch Android */
  #controls {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }
  .d-pad {
    position: absolute;
    left: max(20px, env(safe-area-inset-left));
    bottom: max(25px, env(safe-area-inset-bottom));
    display: flex;
    gap: 15px;
    pointer-events: auto;
  }
  .btn-action {
    position: absolute;
    right: max(25px, env(safe-area-inset-right));
    bottom: max(25px, env(safe-area-inset-bottom));
    pointer-events: auto;
  }
  .touch-btn {
    width: 68px;
    height: 68px;
    background: rgba(255, 255, 255, 0.4);
    border: 3px solid rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    touch-action: none;
  }
  .touch-btn:active {
    background: rgba(255, 255, 255, 0.7);
    transform: scale(0.92);
  }
  #btn-jump {
    width: 80px;
    height: 80px;
    background: #e52521;
    border-color: #fff;
    font-size: 18px;
  }
  #btn-jump:active {
    background: #ff5753;
  }
</style>
</head>
<body>

<div id="ui">
  <div>BIRA <span style="font-size:14px; display:block; color:#ffeb3b;">WORLD 1-1</span></div>
  <div id="score">COIN: 0</div>
</div>

<div id="controls">
  <div class="d-pad">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
  </div>
  <div class="btn-action">
    <div class="touch-btn" id="btn-jump">JUMP</div>
  </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// Asset Gambar Karakter BIRA
const biraImg = new Image();
biraImg.src = "https://raw.githubusercontent.com/reybruh7-art/BiraGame/main/1000335566.png"; 

// Parameter Game
let score = 0;
const gravity = 0.55;
const camera = { x: 0 };

const player = {
  x: 100,
  y: 200,
  width: 52,
  height: 75,
  vx: 0,
  vy: 0,
  speed: 4.8,
  grounded: false,
  facing: 1
};

// Balok & Rintangan (Platform Level)
const blocks = [
  { x: 300, y: 0, w: 50, h: 50, type: "q", hit: false },
  { x: 350, y: 0, w: 50, h: 50, type: "brick" },
  { x: 400, y: 0, w: 50, h: 50, type: "q", hit: false },
  { x: 450, y: 0, w: 50, h: 50, type: "brick" },
  { x: 500, y: 0, w: 50, h: 50, type: "q", hit: false },
  { x: 700, y: 0, w: 120, h: 70, type: "pipe" },
  { x: 950, y: 0, w: 50, h: 50, type: "brick" },
  { x: 1000, y: 0, w: 50, h: 50, type: "q", hit: false },
  { x: 1050, y: 0, w: 50, h: 50, type: "brick" },
  { x: 1250, y: 0, w: 120, h: 100, type: "pipe" },
  { x: 1550, y: 0, w: 60, h: 60, type: "q", hit: false },
  { x: 1800, y: 0, w: 40, h: 320, type: "flag" }
];

const coins = [
  { x: 315, y: 0, collected: false },
  { x: 415, y: 0, collected: false },
  { x: 515, y: 0, collected: false },
  { x: 745, y: 0, collected: false },
  { x: 1015, y: 0, collected: false }
];

// Input Controller
const keys = { left: false, right: false, jump: false };

function setupTouch(id, key) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); keys[key] = true; });
  el.addEventListener("pointerup", (e) => { e.preventDefault(); keys[key] = false; });
  el.addEventListener("pointercancel", (e) => { e.preventDefault(); keys[key] = false; });
}
setupTouch("btn-left", "left");
setupTouch("btn-right", "right");
setupTouch("btn-jump", "jump");

window.addEventListener("keydown", (e) => {
  if (e.code === "ArrowLeft" || e.key === "a") keys.left = true;
  if (e.code === "ArrowRight" || e.key === "d") keys.right = true;
  if (e.code === "Space" || e.code === "ArrowUp" || e.key === "w") keys.jump = true;
});
window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowLeft" || e.key === "a") keys.left = false;
  if (e.code === "ArrowRight" || e.key === "d") keys.right = false;
  if (e.code === "Space" || e.code === "ArrowUp" || e.key === "w") keys.jump = false;
});

function update() {
  const groundY = canvas.height - 110;

  // Gerakan Horizontal
  if (keys.left) {
    player.vx = -player.speed;
    player.facing = -1;
  } else if (keys.right) {
    player.vx = player.speed;
    player.facing = 1;
  } else {
    player.vx *= 0.8;
  }

  // Lompat
  if (keys.jump && player.grounded) {
    player.vy = -14.5;
    player.grounded = false;
  }

  // Gravitasi
  player.vy += gravity;
  player.x += player.vx;
  player.y += player.vy;

  // Cek Tanah
  if (player.y + player.height >= groundY) {
    player.y = groundY - player.height;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  // Cek Balok
  blocks.forEach(b => {
    let bY = groundY - (b.type === "pipe" ? b.h : b.type === "flag" ? b.h : 140);
    b.actualY = bY;

    // Collision Box sederhana
    if (player.x + player.width > b.x && player.x < b.x + b.w) {
      if (player.y + player.height > bY && player.y < bY + b.h) {
        // Mendarat di atas balok
        if (player.vy > 0 && player.y + player.height - player.vy <= bY + 12) {
          player.y = bY - player.height;
          player.vy = 0;
          player.grounded = true;
        } 
        // Menyeruduk balok dari bawah
        else if (player.vy < 0 && player.y - player.vy >= bY + b.h - 12) {
          player.y = bY + b.h;
          player.vy = 2;
          if (b.type === "q" && !b.hit) {
            b.hit = true;
            score += 100;
            document.getElementById("score").innerText = "COIN: " + score;
          }
        }
      }
    }
  });

  // Kamera mengikuti pemain
  camera.x = player.x - canvas.width * 0.35;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const groundY = canvas.height - 110;

  ctx.save();
  ctx.translate(-camera.x, 0);

  // Awan & Bukit Latar Belakang
  ctx.fillStyle = "#ffffff99";
  for (let i = 0; i < 15; i++) {
    ctx.beginPath();
    ctx.arc(i * 350 + 100, 120, 35, 0, Math.PI * 2);
    ctx.arc(i * 350 + 135, 110, 45, 0, Math.PI * 2);
    ctx.arc(i * 350 + 170, 120, 35, 0, Math.PI * 2);
    ctx.fill();
  }

  // Tanah Rumput & Tanah Cokelat
  ctx.fillStyle = "#489e22";
  ctx.fillRect(camera.x, groundY, canvas.width, 22);
  ctx.fillStyle = "#9c5722";
  ctx.fillRect(camera.x, groundY + 22, canvas.width, canvas.height - (groundY + 22));

  // Gambar Balok
  blocks.forEach(b => {
    let bY = b.actualY || (groundY - 140);
    if (b.type === "q") {
      ctx.fillStyle = b.hit ? "#8e6741" : "#fcb42c";
      ctx.fillRect(b.x, bY, b.w, b.h);
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 3;
      ctx.strokeRect(b.x, bY, b.w, b.h);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 24px monospace";
      ctx.fillText(b.hit ? "•" : "?", b.x + 18, bY + 34);
    } else if (b.type === "brick") {
      ctx.fillStyle = "#b84418";
      ctx.fillRect(b.x, bY, b.w, b.h);
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x, bY, b.w, b.h);
    } else if (b.type === "pipe") {
      ctx.fillStyle = "#1e9624";
      ctx.fillRect(b.x, bY, b.w, b.h);
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 3;
      ctx.strokeRect(b.x, bY, b.w, b.h);
    } else if (b.type === "flag") {
      ctx.fillStyle = "#fff";
      ctx.fillRect(b.x, bY, 8, b.h);
      ctx.fillStyle = "#4caf50";
      ctx.beginPath();
      ctx.moveTo(b.x + 8, bY);
      ctx.lineTo(b.x + 50, bY + 25);
      ctx.lineTo(b.x + 8, bY + 50);
      ctx.fill();
    }
  });

  // Gambar Karakter BIRA
  ctx.save();
  ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
  if (player.facing === -1) {
    ctx.scale(-1, 1);
  }
  
  if (biraImg.complete && biraImg.naturalWidth > 0) {
    ctx.drawImage(biraImg, -player.width / 2, -player.height / 2, player.width, player.height);
  } else {
    // Cadangan kotak hijau jika gambar sedang memuat
    ctx.fillStyle = "#8bd414";
    ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
  }
  ctx.restore();

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
