<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BIRA — Green Valley Explorer</title>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#b9d7a0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.title{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;color:white;text-shadow:0 2px 8px #355c2a;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:11px;font-weight:600;opacity:.9}
#hint{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));padding:9px 12px;border-radius:14px;background:#ffffff3d;color:#fff;font-size:12px;backdrop-filter:blur(8px)}
#joystick{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff55;box-shadow:inset 0 0 20px #ffffff16;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:58px;height:58px;left:33px;top:33px;border-radius:50%;background:#ffffff55;border:2px solid #fff9;box-shadow:0 5px 18px #0002}
#jump{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:86px;height:86px;border:0;border-radius:50%;background:#1e8f46e8;color:#fff;font-weight:900;letter-spacing:1px;box-shadow:0 8px 24px #155b2c55,inset 0 2px 0 #ffffff55;pointer-events:auto;touch-action:none}
#jump:active{transform:scale(.94)}
@media(min-width:800px){#joystick,#jump{opacity:.62}.title{font-size:18px}#hint{font-size:13px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="title">BIRA <small>GREEN VALLEY EXPLORER</small></div>
  <div id="hint">WASD / ↑↓←→ • SPACE untuk lompat</div>
  <div id="joystick"><div id="stick"></div></div>
  <button id="jump">JUMP</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb8d7a0);
scene.fog=new THREE.FogExp2(0xcfe2b8,0.012);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,220);
camera.position.set(0,5,8);

const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
document.querySelector("#app").appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffe5b5,0x4b7c43,2.1); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffc66b,3.2);
sun.position.set(-35,45,20); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;
scene.add(sun);

const world=new THREE.Group();scene.add(world);
const groundMat=new THREE.MeshStandardMaterial({color:0x6eb64c,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),groundMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);

// rolling hills
const hillMat=new THREE.MeshStandardMaterial({color:0x78bd52,roughness:1});
for(let i=0;i<14;i++){
  const h=new THREE.Mesh(new THREE.SphereGeometry(9+Math.random()*8,12,7),hillMat);
  h.scale.y=.28+Math.random()*.22;
  h.position.set((Math.random()-.5)*120,-1.2,(Math.random()-.5)*110);
  h.receiveShadow=true;world.add(h);
}

// low-poly trees
function tree(x,z,s=1){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.35*s,2.5*s,7),new THREE.MeshStandardMaterial({color:0x7a542f,roughness:1}));
  trunk.position.y=1.25*s;trunk.castShadow=true;g.add(trunk);
  const leafMat=new THREE.MeshStandardMaterial({color:0x2f8f43,roughness:.9});
  for(let j=0;j<3;j++){
    const c=new THREE.Mesh(new THREE.IcosahedronGeometry((1.35-j*.15)*s,1),leafMat);
    c.position.set((j-1)*.45*s,(2.4+j*.65)*s,0);
    c.scale.y=1.1;c.castShadow=true;g.add(c);
  }
  g.position.set(x,0,z);world.add(g);
}
for(let i=0;i<38;i++){
  const a=Math.random()*Math.PI*2,r=18+Math.random()*55;
  tree(Math.cos(a)*r,Math.sin(a)*r,.65+Math.random()*.9);
}

// rocks + flowers
for(let i=0;i<45;i++){
  const a=Math.random()*Math.PI*2,r=7+Math.random()*65;
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.25+Math.random()*.65,0),new THREE.MeshStandardMaterial({color:0x777f6e,roughness:1}));
  rock.position.set(Math.cos(a)*r,.25,Math.sin(a)*r);rock.scale.y=.55;rock.castShadow=true;world.add(rock);
}
for(let i=0;i<130;i++){
  const a=Math.random()*Math.PI*2,r=5+Math.random()*65;
  const g=new THREE.Group();
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.012,.018,.35,5),new THREE.MeshStandardMaterial({color:0x3d873e}));
  stem.position.y=.18;g.add(stem);
  const petal=new THREE.Mesh(new THREE.SphereGeometry(.09,6,5),new THREE.MeshStandardMaterial({color:[0xffe56b,0xff9fb8,0xffffff,0xb7a6ff][i%4]}));
  petal.scale.set(1,.55,1);petal.position.y=.39;g.add(petal);
  g.position.set(Math.cos(a)*r,.0,Math.sin(a)*r);world.add(g);
}

// firefly / pollen particles
const count=550, pos=new Float32Array(count*3);
for(let i=0;i<count;i++){pos[i*3]=(Math.random()-.5)*120;pos[i*3+1]=1+Math.random()*10;pos[i*3+2]=(Math.random()-.5)*120}
const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pos,3));
const pm=new THREE.PointsMaterial({color:0xfff1a0,size:.09,transparent:true,opacity:.75});
const particles=new THREE.Points(pg,pm);scene.add(particles);

// BIRA-inspired stylized low-poly character
const player=new THREE.Group();player.position.set(0,0,0);scene.add(player);
const green=new THREE.MeshStandardMaterial({color:0x8bd414,roughness:.8});
const darkGreen=new THREE.MeshStandardMaterial({color:0x229447,roughness:.8});
const cream=new THREE.MeshStandardMaterial({color:0xffefd0,roughness:.9});
const black=new THREE.MeshStandardMaterial({color:0x151515,roughness:.25});
const blue=new THREE.MeshStandardMaterial({color:0x12bce9,roughness:.2,metalness:.1});

const body=new THREE.Mesh(new THREE.SphereGeometry(1.18,12,9),green);body.scale.set(.82,1.15,.62);body.position.y=1.35;body.castShadow=true;player.add(body);
const face=new THREE.Mesh(new THREE.SphereGeometry(.82,12,9),cream);face.scale.set(1,.88,.35);face.position.set(0,1.52,.55);player.add(face);
for(const x of [-.32,.32]){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.24,12,10),black);eye.scale.z=.5;eye.position.set(x,1.65,.79);player.add(eye);
  const shine=new THREE.Mesh(new THREE.SphereGeometry(.065,8,6),new THREE.MeshBasicMaterial({color:0xffffff}));shine.position.set(x-.07,1.73,.91);player.add(shine);
}
const mouth=new THREE.Mesh(new THREE.SphereGeometry(.18,10,7),new THREE.MeshStandardMaterial({color:0x8e1820}));mouth.scale.set(1,.65,.45);mouth.position.set(0,1.27,.84);player.add(mouth);
const leafTop=new THREE.Mesh(new THREE.SphereGeometry(.55,7,5),green);leafTop.scale.set(.45,1.55,.18);leafTop.rotation.z=-.22;leafTop.position.set(.05,2.55,.02);player.add(leafTop);
for(const x of [-.75,.75]){
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(.6,7,5),darkGreen);leaf.scale.set(.55,.85,.15);leaf.rotation.z=x<0?-.65:.65;leaf.position.set(x,2.05,0);player.add(leaf);
}
const drop=new THREE.Mesh(new THREE.SphereGeometry(.18,12,8),blue);drop.scale.set(.7,1.25,.45);drop.position.set(0,2.05,.78);player.add(drop);

const limbs=[];
for(const x of [-.78,.78]){
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.8,4,8),green);arm.position.set(x,1.15,0);arm.rotation.z=x<0?-.25:.25;arm.castShadow=true;player.add(arm);limbs.push(arm);
}
for(const x of [-.42,.42]){
  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.2,.75,4,8),green);leg.position.set(x,.48,0);leg.castShadow=true;player.add(leg);limbs.push(leg);
}
const leafBack=new THREE.Mesh(new THREE.SphereGeometry(.65,7,5),darkGreen);leafBack.scale.set(.65,.95,.18);leafBack.rotation.z=-.5;leafBack.position.set(.7,1.0,-.45);player.add(leafBack);

const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")jump()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let joy={x:0,y:0}, jumping=false, vy=0;
function jump(){if(!jumping){jumping=true;vy=6.3}}
const jumpBtn=document.querySelector("#jump");jumpBtn.addEventListener("pointerdown",e=>{e.preventDefault();jump()});

const joyEl=document.querySelector("#joystick"),stick=document.querySelector("#stick");
let joyPointer=null;
joyEl.addEventListener("pointerdown",e=>{joyPointer=e.pointerId;joyEl.setPointerCapture(e.pointerId);moveJoy(e)});
joyEl.addEventListener("pointermove",e=>{if(e.pointerId===joyPointer)moveJoy(e)});
joyEl.addEventListener("pointerup",resetJoy);joyEl.addEventListener("pointercancel",resetJoy);
function moveJoy(e){
 const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,max=48,l=Math.hypot(dx,dy);if(l>max){dx*=max/l;dy*=max/l}
 joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetJoy(){joyPointer=null;joy.x=joy.y=0;stick.style.transform=""}

const clock=new THREE.Clock(),camTarget=new THREE.Vector3(),desiredCam=new THREE.Vector3();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.033),t=clock.elapsedTime;
 let ix=(keys["d"]?1:0)-(keys["a"]?1:0)+(keys["arrowright"]?1:0)-(keys["arrowleft"]?1:0);
 let iz=(keys["s"]?1:0)-(keys["w"]?1:0)+(keys["arrowdown"]?1:0)-(keys["arrowup"]?1:0);
 ix+=joy.x;iz+=joy.y;
 const len=Math.hypot(ix,iz);if(len>1){ix/=len;iz/=len}
 const moving=len>.08;
 const speed=5.2;
 if(moving){
   const dx=ix*speed*dt,dz=iz*speed*dt;
   player.position.x+=dx;player.position.z+=dz;
   const targetRot=Math.atan2(ix,iz);
   let diff=targetRot-player.rotation.y;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
   player.rotation.y+=diff*Math.min(1,dt*10);
 }
 if(jumping){vy-=15*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;jumping=false;vy=0}}
 const bob=moving?Math.sin(t*12)*.045:Math.sin(t*2.2)*.025;
 body.position.y=1.35+bob;face.position.y=1.52+bob;drop.position.y=2.05+bob;
 limbs[0].rotation.x=moving?Math.sin(t*10)*.35:Math.sin(t*2)*.04;
 limbs[1].rotation.x=moving?-Math.sin(t*10)*.35:Math.sin(t*2)*-.04;
 limbs[2].rotation.x=moving?-Math.sin(t*10)*.4:0;
 limbs[3].rotation.x=moving?Math.sin(t*10)*.4:0;
 const followDist=7.2,followHeight=4.2;
 desiredCam.set(player.position.x,player.position.y+followHeight,player.position.z-followDist);
 camera.position.lerp(desiredCam,1-Math.pow(.001,dt));
 camTarget.lerp(new THREE.Vector3(player.position.x,player.position.y+1.25,player.position.z),1-Math.pow(.0005,dt));
 camera.lookAt(camTarget);
 particles.rotation.y=t*.015;
 renderer.render(scene,camera);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))});
document.addEventListener("contextmenu",e=>e.preventDefault());
animate();
</script>
</body>
</html>
