<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BIRA — Green Valley Explorer</title>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#b9d7a0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;overscroll-behavior:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.title{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;color:white;text-shadow:0 2px 8px #355c2a;font-weight:800;letter-spacing:.5px}
.title small{display:block;font-size:11px;font-weight:600;opacity:.9}
#hint{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));padding:9px 12px;border-radius:14px;background:#ffffff3d;color:#fff;font-size:12px;backdrop-filter:blur(8px)}
#joystick{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff55;box-shadow:inset 0 0 20px #ffffff16;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:58px;height:58px;left:33px;top:33px;border-radius:50%;background:#ffffff55;border:2px solid #fff9;box-shadow:0 5px 18px #0002}
#jump{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:86px;height:86px;border:0;border-radius:50%;background:#1e8f46e8;color:#fff;font-weight:900;letter-spacing:1px;box-shadow:0 8px 24px #155b2c55,inset 0 2px 0 #ffffff55;pointer-events:auto;touch-action:none}
#jump:active{transform:scale(.94)}
@media(min-width:800px){#joystick,#jump{opacity:.62}.title{font-size:18px}#hint{font-size:13px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="title">BIRA <small>GREEN VALLEY EXPLORER</small></div>
  <div id="hint">Gunakan joystick di layar untuk jalan</div>
  <div id="joystick"><div id="stick"></div></div>
  <button id="jump">JUMP</button>
</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8d7a0);
scene.fog = new THREE.FogExp2(0xb8d7a0, 0.015);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.querySelector("#app").appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xfff0d0, 0x4b7c43, 1.8);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffdf9e, 2.5);
sun.position.set(-30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

const world = new THREE.Group();
scene.add(world);

const groundMat = new THREE.MeshStandardMaterial({ color: 0x6eb64c, roughness: 1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
world.add(ground);

// Perbukitan
const hillMat = new THREE.MeshStandardMaterial({ color: 0x78bd52, roughness: 1 });
for(let i = 0; i < 12; i++){
  const h = new THREE.Mesh(new THREE.SphereGeometry(9 + Math.random() * 8, 10, 6), hillMat);
  h.scale.y = 0.28;
  h.position.set((Math.random() - 0.5) * 110, -1, (Math.random() - 0.5) * 110);
  h.receiveShadow = true;
  world.add(h);
}

// Pohon
function tree(x, z, s = 1){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2*s, 0.3*s, 2*s, 6), new THREE.MeshStandardMaterial({ color: 0x7a542f }));
  trunk.position.y = 1 * s;
  trunk.castShadow = true;
  g.add(trunk);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f8f43, roughness: 0.9 });
  for(let j = 0; j < 3; j++){
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry((1.2 - j * 0.15) * s, 1), leafMat);
    c.position.set(0, (1.8 + j * 0.6) * s, 0);
    c.castShadow = true;
    g.add(c);
  }
  g.position.set(x, 0, z);
  world.add(g);
}
for(let i = 0; i < 35; i++){
  const a = Math.random() * Math.PI * 2, r = 14 + Math.random() * 50;
  tree(Math.cos(a) * r, Math.sin(a) * r, 0.7 + Math.random() * 0.7);
}

// Karakter
const player = new THREE.Group();
scene.add(player);

const green = new THREE.MeshStandardMaterial({ color: 0x8bd414 });
const darkGreen = new THREE.MeshStandardMaterial({ color: 0x229447 });
const cream = new THREE.MeshStandardMaterial({ color: 0xffefd0 });
const black = new THREE.MeshBasicMaterial({ color: 0x111111 });

const body = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), green);
body.scale.set(0.85, 1.1, 0.7);
body.position.y = 1.3;
body.castShadow = true;
player.add(body);

const face = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 10), cream);
face.scale.set(0.9, 0.8, 0.3);
face.position.set(0, 1.45, 0.5);
player.add(face);

for(const x of [-0.28, 0.28]){
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), black);
  eye.position.set(x, 1.55, 0.68);
  player.add(eye);
}

const leafTop = new THREE.Mesh(new THREE.SphereGeometry(0.45, 7, 5), green);
leafTop.scale.set(0.4, 1.4, 0.2);
leafTop.position.set(0, 2.3, 0);
player.add(leafTop);

const limbs = [];
for(const x of [-0.65, 0.65]){
  const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.6, 4, 8), green);
  arm.position.set(x, 1.1, 0);
  arm.castShadow = true;
  player.add(arm);
  limbs.push(arm);
}
for(const x of [-0.35, 0.35]){
  const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.6, 4, 8), green);
  leg.position.set(x, 0.45, 0);
  leg.castShadow = true;
  player.add(leg);
  limbs.push(leg);
}

// Kontrol
let joy = { x: 0, y: 0 }, jumping = false, vy = 0;
function jump(){
  if(!jumping){
    jumping = true;
    vy = 7.5;
  }
}
document.querySelector("#jump").addEventListener("pointerdown", e => { e.preventDefault(); jump(); });

const joyEl = document.querySelector("#joystick"), stick = document.querySelector("#stick");
let joyPointer = null;

joyEl.addEventListener("pointerdown", e => {
  joyPointer = e.pointerId;
  joyEl.setPointerCapture(e.pointerId);
  moveJoy(e);
});
joyEl.addEventListener("pointermove", e => {
  if(e.pointerId === joyPointer) moveJoy(e);
});
function resetJoy(){
  joyPointer = null;
  joy.x = 0; joy.y = 0;
  stick.style.transform = "";
}
joyEl.addEventListener("pointerup", resetJoy);
joyEl.addEventListener("pointercancel", resetJoy);

function moveJoy(e){
  const r = joyEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const max = 45, l = Math.hypot(dx, dy);
  if(l > max){ dx *= max / l; dy *= max / l; }
  joy.x = dx / max;
  joy.y = dy / max;
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
}

const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  let ix = joy.x;
  let iz = joy.y;
  const len = Math.hypot(ix, iz);
  const moving = len > 0.1;

  if(moving){
    const speed = 5.5;
    player.position.x += ix * speed * dt;
    player.position.z += iz * speed * dt;
    player.rotation.y = Math.atan2(ix, iz);
  }

  if(jumping){
    vy -= 18 * dt;
    player.position.y += vy * dt;
    if(player.position.y <= 0){
      player.position.y = 0;
      jumping = false;
      vy = 0;
    }
  }

  const bob = moving ? Math.sin(t * 12) * 0.05 : Math.sin(t * 2.5) * 0.02;
  body.position.y = 1.3 + bob;
  face.position.y = 1.45 + bob;
  limbs[0].rotation.x = moving ? Math.sin(t * 10) * 0.4 : 0;
  limbs[1].rotation.x = moving ? -Math.sin(t * 10) * 0.4 : 0;
  limbs[2].rotation.x = moving ? -Math.sin(t * 10) * 0.4 : 0;
  limbs[3].rotation.x = moving ? Math.sin(t * 10) * 0.4 : 0;

  // Kamera di belakang karakter
  const desiredCam = new THREE.Vector3(player.position.x, player.position.y + 4.5, player.position.z + 7.5);
  camera.position.lerp(desiredCam, 0.1);
  camTarget.set(player.position.x, player.position.y + 1.2, player.position.z);
  camera.lookAt(camTarget);

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
